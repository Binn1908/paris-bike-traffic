[project]
name = "velo-paris"
version = "0.1.0"
description = ""
authors = [
    {name = "Chinnawat"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "plotly (>=6.5.0,<7.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "xgboost (>=3.1.2,<4.0.0)",
    "shap (>=0.50.0,<0.51.0)",
    "tabulate (>=0.9.0,<0.10.0)",
    "kaleido (>=1.2.0,<2.0.0)",
    "streamlit (>=1.52.2,<2.0.0)",
    "nbconvert (>=7.16.6,<8.0.0)",
    "jupyterlab (>=4.5.1,<5.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pymysql (>=1.1.3,<2.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "mlflow (>=3.13.0,<4.0.0)",
    "prometheus-fastapi-instrumentator"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "jupyterlab (>=4.5.1,<5.0.0)"
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py312"
# Notebooks d'exploration et dossiers de données/artefacts : hors périmètre du linter CI
extend-exclude = ["notebooks", "data", "models", "reports"]

[tool.ruff.lint]
# E/F : erreurs pycodestyle + pyflakes (bugs réels : imports/variables inutilisés, etc.)
# I : tri des imports
# On exclut volontairement les règles plus strictes (sécurité, datetime, async...)
# qui ne correspondent pas aux choix de conception assumés de ce projet.
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Blocs de texte de présentation Streamlit (contenu, pas de la logique) : lignes longues tolérées
"streamlit/tabs/tab_presentation.py" = ["E501"]